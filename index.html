            background-color: #fff;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;

            border-radius: 3px;
            overflow: hidden;

        }

            width: 0%;

        }

            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px;
            background-color: #ffffff;
            margin-bottom: 24px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-color);
            background-color: #eff6ff;
            padding: 4px 10px;
            border-radius: 20px;
        }

            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .answer-box {
            display: none;
            background-color: #f0fdf4;
            border-left: 4px solid var(--accent-green);
            padding: 16px;
            border-radius: 6px;
            margin-top: 16px;
        }

            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-green);
            margin-bottom: 4px;
        }

        .english-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #166534;
            line-height: 1.5;
        }

            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background-color: #f1f5f9;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .toggle-container {
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

    document.getElementById('jaText').innerText = item.ja;
    document.getElementById('enText').innerText = item.en;

    // Reset answer box
    document.getElementById('answerBox').style.display = 'none';
    document.getElementById('toggleBtn').innerText = '解答を表示';

    // Progress bar update
    const percent = ((currentIndex + 1) / list.length) * 100;
    document.getElementById('progressBar').style.width = `${percent}%`;

    // Button state
    document.getElementById('prevBtn').disabled = currentIndex === 0;
    document.getElementById('nextBtn').disabled = currentIndex === list.length - 1;
}

function changeLesson() {
    currentKey = document.getElementById('lessonSelect').value;
    currentIndex = 0;
    updateCard();
}

function toggleAnswer() {
    const box = document.getElementById('answerBox');
    const btn = document.getElementById('toggleBtn');
    if (box.style.display === 'none' || box.style.display === '') {
        box.style.display = 'block';
        btn.innerText = '解答を非表示';
    } else {
        box.style.display = 'none';
        btn.innerText = '解答を表示';
    }
}

function nextQuestion() {
    if (currentIndex < dataset[currentKey].length - 1) {
        currentIndex++;
        updateCard();
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        updateCard();
    }
}

// キーボード操作対応 (左右キーで移動、スペースキーで解答表示)
document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextQuestion();
    if (e.key === 'ArrowLeft') prevQuestion();
    if (e.key === ' ') {
        e.preventDefault();
        toggleAnswer();
    }
});

// 初期化
updateCard();
</script>
</body>
</html>
